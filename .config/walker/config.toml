theme = "blendos"
force_keyboard_focus = true
close_when_open = true
click_to_close = true
single_click_activation = true
selection_wrap = false
hide_quick_activation = false
hide_action_hints = false
hide_action_hints_dmenu = true
hide_return_action = false
resume_last_query = false
page_jump_items = 10

[shell]
exclusive_zone = -1
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[placeholders]
"default" = { input = "Search utilities", list = "No matching utility" }

[keybinds]
close = ["Escape"]
next = ["Down"]
previous = ["Up"]
left = ["Left"]
right = ["Right"]
down = ["Down"]
up = ["Up"]
page_down = ["Page_Down"]
page_up = ["Page_Up"]
quick_activate = ["F1", "F2", "F3", "F4"]
show_actions = ["alt j"]

[providers]
default = ["providerlist", "clipboard", "symbols", "windows"]
empty = ["providerlist", "runner"]
ignore_preview = []
max_results = 50

[providers.max_results_provider]
menus = 20
symbols = 30
clipboard = 30
windows = 30
runner = 20

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "$"
provider = "windows"
