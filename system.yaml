repo: 'https://pkg-repo.blendos.co'
arch-repo: 'https://archlinux.c3sl.ufpr.br'

track: 'custom'

# Verified native RustDesk artifacts are served locally throughout the rebuild.
package-repos:
  - name: 'workstation-local'
    repo-url: 'http://127.0.0.1:18789'

# Common System Definition. Hardware packages/services belong to profiles/*.yaml.
# ./bootstrap composes the selected profile into private Local State.
