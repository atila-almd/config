  - 'coreutils'
  - 'file'
  - 'filesystem-blend'
  - 'findutils'
  - 'gawk'
  - 'gcc-libs'
  - 'gettext'
  - 'git'
  # Bootstrap composes explicit Machine Profiles with Akshara's YAML parser.
  - 'python'
  - 'python-yaml'
  # Build the project-owned desktop data service during home installation.
  - 'go'
  - 'glibc'
  - 'grep'
  - 'gzip'
  - 'licenses'
  - 'pacman'
  - 'procps-ng'
  - 'psmisc'
  - 'sed'
  - 'shadow'
  - 'sudo'
  - 'systemd'
  - 'systemd-sysvcompat'
  - 'tar'
  # Measured process usage for explicitly launched coding agents.
