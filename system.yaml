aur-packages:
  # Desktop applications
  # Walker's source-built Elephant core and providers must be rebuilt at the
  # same upstream version; Go plugins are ABI-sensitive.
  - 'elephant'
  - 'elephant-calc'
  - 'elephant-clipboard'
  - 'elephant-desktopapplications'
  - 'elephant-files'
  - 'elephant-menus'
  - 'elephant-providerlist'
  - 'elephant-runner'
  - 'elephant-symbols'
  - 'elephant-websearch'
  - 'elephant-windows'
  - 'helium-browser-bin'
  - 'walker-bin'
  - 'zen-browser-bin'

  # System utility
  - 'zramswap'

services:
  # Core system
  - 'NetworkManager'
  - 'systemd-resolved'
  - 'ufw'

  # Login and memory
  - 'greetd.service'
  - 'zramswap'

  # Remote access
  - 'rustdesk.service'
  - 'tailscaled'

  # Optional profile: Bluetooth; requires the bluez package above.
  # - 'bluetooth'

  # Optional profile: printing; requires the cups package above.
  # - 'cups'

user-services:
  # blendOS integration
  - 'blend-files'

  # Desktop session
  - 'pipewire-pulse'
  - 'wireplumber'

  # Rootless containers
  - 'podman.socket'

commands:
  # greetd owns pre-login authentication and starts the project-owned host.
  # The installer publishes the host and public identity bundle before this
  # service is enabled; the condition below keeps a rebuilt image on a TTY
  # until that normal provisioning step has completed.
  - |
    install -d -m0755 /etc/greetd
    printf '[terminal]\nvt = 2\nswitch = true\n\n[general]\nsource_profile = false\n\n[default_session]\ncommand = "/etc/blendos-workstation/identity/greeter-host"\nuser = "greeter"\n' > /etc/greetd/config.toml
  - |
    test -f /etc/pam.d/greetd
    for line in 'auth optional pam_gnome_keyring.so' 'session optional pam_gnome_keyring.so auto_start' 'password optional pam_gnome_keyring.so'; do
      grep -Fqx "$line" /etc/pam.d/greetd || printf '%s\n' "$line" >> /etc/pam.d/greetd
    done
  - |
    install -d -m0755 /etc/systemd/system/greetd.service.d
    printf '[Unit]\nConditionPathExists=/etc/blendos-workstation/identity/greeter-host\nConditionPathExists=/etc/blendos-workstation/identity/public-theme.json\n' > /etc/systemd/system/greetd.service.d/10-blendos-identity.conf
  # PAM authentication is owned by the independent Quickshell locker.
  - 'printf "auth include system-auth\n" > /etc/pam.d/workstation-lock'
  - 'install -Dm644 /usr/etc/shells /etc/shells'
  # Portless runs as the desktop user and owns only loopback port 80.
  - 'printf "net.ipv4.ip_unprivileged_port_start=80\n" > /etc/sysctl.d/90-portless.conf'
  - 'rm -f /usr/share/applications/Waydroid.desktop'
